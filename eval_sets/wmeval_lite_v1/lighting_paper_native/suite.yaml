schema_version: 1
suite_name: WMEval historical native lighting
version: paper-native
dimensions:
  lighting_shading:
    display_name: Lighting & Shading
    description: 'Reference-free lighting/shadow physics: GroundingDINO + SAM2 tracking
      with Hu-moment shape signatures (SRR/SDR/MOSD/SDJ/SAS/SSD) under the paper''s
      first-person, fixed-sun, walking-orbit regime. Live on its paper-target scene
      SunRisesAndSets/lighting since 2026-09-15 (see the dated banner above for provenance
      and the analytic geometry floor); ChessBoard/lighting is still pending a team
      decision (PENDING.md).'
    evaluator: registry
    requires_reference: false
    modules:
    - shadow_consistency
    metric_config:
      eval_fps: 24.0
      max_pairs: 0
    cases:
    - SunRisesAndSets/lighting
    aggregate:
      headline: shadow_direction_jitter_deg_per_frame
      direction: lower
      extra_means:
      - scene_retention_rate_pct
      - shadow_detection_rate_pct
      - multi_object_sun_disagreement_deg
      - shadow_area_stability_pct
      - shadow_shape_drift
