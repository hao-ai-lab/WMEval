# ROOT CAUSE FOUND: DEPTH_DEFAULT_MODEL was
# "depth-anything/Depth-Anything-V2-Small-hf" -- a RELATIVE depth model
# (arbitrary per-image scale, no real units), being compared directly
# against Unity's real metric-scale depth. That alone explains most of the
# ~55-99% depth_absrel_pct self-match error seen across every B.1 case all
# last session. Fixed by switching to real metric-depth checkpoints and
# empirically picking indoor vs outdoor per scene (single-pixel sanity
# test against known Unity depth, 6 cases): outdoor wins 4/6 (RacingCar,
# WanderingGarden, ChessBoard, BallRoller), indoor wins for BilliardGame
# and is least-bad for MirrorRollingBall. New default:
# depth-anything/Depth-Anything-V2-Metric-Outdoor-Small-hf; BilliardGame
# and MirrorRollingBall override to Metric-Indoor via
# eoc_depth_model/kin_depth_model.
#
# REAL, END-TO-END-VERIFIED before/after depth_absrel_pct (self-match):
#   WanderingGarden/scene_first:  98.67% -> 5.96%   (16x better)
#   BilliardGame/prompt_first:    63.69% -> 19.66%  (3.2x better)
#   RacingCar/prompt_third:       28.03% -> 12.66%  (2.2x better, combines
#                                  the depth-model fix with the poses/offset
#                                  refit below)
#   BilliardGame pairwise_distance_mae_pct: 127.71% -> 13.62% (9.4x better)
#   MirrorRollingBall/prompt_third: ~7% -> 84.78% -- NOT an improvement,
#     and NOT a regression caused by this fix either: the old ~7% was the
#     relative model's arbitrary scale coincidentally landing near 1:1
#     with this scene's real depth range -- luck, not accuracy. 84.78% is
#     an honestly-computed metric-space number; the underlying scene
#     (reflective/mirror spheres) is a known hard case for any monocular
#     depth model, since specular surfaces don't have a well-defined
#     estimable "surface depth". Kept the indoor override anyway since
#     it's still the least-bad of the 3 real options tested for this
#     scene (indoor 79% vs relative 111% vs outdoor 160% at a single
#     sampled frame/anchor) -- a worse-but-honest number beats a
#     better-looking coincidence.
#
# kinematics_mechanics: replaced the 2-point finite-difference velocity
# (extremely sensitive to per-frame depth-map noise) with
# `_linear_velocity_fit`, a least-squares linear-in-time fit across a
# trailing window of tracked frames (kin_depth_lift_window, default 6),
# applied identically to both estimated and ground-truth velocity for a
# fair comparison. Combined with the depth-model fix, BilliardGame's
# "yellow ball" (the one genuinely-moving anchor) momentum
# error_rate_pct dropped from 381% to 23.25% (kinetic energy: 41.09%) --
# now a real, usable number. ("red ball"'s error_rate_pct is still huge
# in relative terms because its ground-truth speed is ~0, so any nonzero
# estimate blows up the relative-error denominator regardless of how
# small the absolute error is -- a known, inherent limitation of a
# relative-error formula near a zero baseline, not a bug.)
#
# kinematics_mechanics also had a real identity-swap bug fixed this round
# (see the kinematics_mechanics dimension description below for the
# BilliardGame writeup) via a new HSV color-consistency filter, reordered
# to run BEFORE `_dedupe_seed_detections` (not after -- dedup already
# collapses same-label boxes to the single highest-scoring one, so a
# same-frame false positive that outscores the real object would survive
