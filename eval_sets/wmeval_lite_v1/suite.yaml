# 2026-09-18: physical_causality and fluid_mechanics wired. The suite now
# covers 8 of the paper's 8 dimensions. Both were pure data-authoring work --
# PR #19's API (LIQUID_MODULES, the normalization tokens,
# install_liquid_reference_artifacts, ARTIFACT_QA_DATASET, every module in
# MODULE_REGISTRY and every extractor in lite/aggregate.py) was already
# merged. Two small code fixes were needed anyway; see the bottom of this
# banner.
# ==========================================================================
#
# Target scene x dimension mapping (paper, 2026-07-08):
#   ChessBoard        -> prompt_scene_consistency (live), lighting_shading (data pending),
#                        environment_object_consistency (live, scoped, see below)
#   BallRoller        -> kinematics_mechanics (live, scoped), action_controllability,
#                        environment_object_consistency (live, scoped)
#   RacingCar         -> kinematics_mechanics (data unusable -- no static anchors,
#                        see PENDING.md), prompt_scene_consistency
#   MirrorRollingBall -> lpips, prompt_scene_consistency
#   WanderingGarden   -> scene_character_consistency                     (data pending),
#                        environment_object_consistency (live, scoped, see below)
#   SunRisesAndSets   -> lighting_shading                                LIVE (SunRisesAndSets/lighting, 2026-09-15)
#   LiquidContainer   -> fluid_mechanics (LIVE, all 4 action profiles, 2026-09)
#   BeamDomino        -> physical_causality (LIVE, all 3 trajectory shapes, 2026-09)
#   BilliardGame      -> per paper Table 10 + Sec 4.2 results narrative, its REAL
#                        primary dimension is kinematics_mechanics (paper explicitly
#                        compares Billiard Game vs Racing Car there), not
#                        environment_object_consistency -- now live, scoped, see below
#                        (added 2026-08 since a real capture now exists). Also wired
#                        into environment_object_consistency (live, scoped) though the
#                        paper's own object-consistency results narrative only reports
#                        Garden/BilliardGame/MirrorRollingBall for that dimension, and
#                        additionally expects character consistency on BilliardGame
#                        (currently disabled here -- see PENDING.md).
#
# Dimensions not yet wired (add here when ready):
#   environment_object_consistency  LIVE (BallRoller/ctrl, MirrorRollingBall/prompt_third,
#                              ChessBoard/walk_third, WanderingGarden/scene_first,
#                              BilliardGame/prompt_first) as of 2026-08. BallRoller/ctrl
#                              updated 2026-08 with a
#                              recovered camera pose (see below). Covers both halves of
#                              paper appendix B.1 for that case: object consistency
#                              (depth AbsRel, pairwise-distance MAE, object permanence
#                              -- scoped to static "ramp"/"dome"/"cube" obstacles) AND
#                              character consistency (DINOv2 identity check on the
#                              "player" ball, reference-free).
#                              object_permanence_pct / character_consistency_pct are
#                              clean (100% self-match each). depth_absrel_pct/
#                              pairwise_distance_mae_pct are real and correctly wired;
#                              after the camera-pose fix below they improved from
#                              ~80%/70% to ~62%/60% self-match error -- the remaining
#                              error is a SEPARATE, already-diagnosed cause: a
#                              real-world-trained monocular depth model
#                              (Depth-Anything-V2-Metric) applied zero-shot to
#                              synthetic Unity content has a ~4-5x systematic scale
#                              bias, unrelated to camera pose. Treat those two
#                              sub-metrics as directionally noisy until a
#                              domain-appropriate depth model or calibration step is
#                              adopted.
#
#   MirrorRollingBall/prompt_third (added 2026-08): unlike BallRoller/RacingCar, this
#                              case's shipped poses.npy/intrinsics.npy needed NO
#                              correction at all -- verified by reprojecting the known,
#                              Edit-mode-read Player world position (0, 0.5, 0) through
#                              every one of the 300 frames' camera poses and landing
#                              exactly on the image center (640, 360) every time (a
#                              real look-at/orbit chase camera; translation traces a
#                              clean circular orbit of radius ~2.23 around the origin,
#                              confirmed via x^2+z^2 = const across all 300 frames).
#                              Scoped to ONE static anchor: the 48 "YellowBall"
#                              GameObjects in the scene's grid are visually identical,
#                              so eoc_text_prompt ("yellow sphere.") can only ever seed
#                              ONE tracked instance (the module's own dedupe logic
#                              collapses same-label detections to their single
#                              highest-scoring box) -- identified as `YellowBall (30)`
#                              at world (-2, 0.5, -0.05) by reprojecting all 48 known
#                              ball positions into frame 0 and matching against
#                              GroundingDINO's top-scoring box, cross-validated with an
#                              independent VLM pixel-center estimate: reprojection
#                              (145.4, 357.3) vs GroundingDINO (142.7, 357.4) vs VLM
#                              (137, 351), all agreeing within 8px. `wall.` detections
#                              are degenerate (the low gray boundary wall spans >60% of
#                              the frame at this FOV, tripping the module's own
#                              whole-frame-box filter) so pairwise_distance_mae_pct is
#                              expected/left None for this case -- not a bug, just no
#                              second distinguishable anchor available in this scene.
#                              Self-consistency check (candidate = reference video,
#                              first 60 of 300 frames -- the object's continuous
#                              visibility window is frames 0-152; 60 was used only to
#                              keep the validation run's wall-clock time reasonable,
#                              the shipped case artifacts cover the full 300-frame/
#                              201-visible-frame span): object_permanence_pct 100.0,
#                              depth_absrel_pct 7.22% (self-match error -- far better
#                              than BallRoller/ctrl's ~62%, consistent with this case
#                              needing no camera-pose correction at all),
#                              character_consistency_pct null (eoc_character_prompt
#                              deliberately non-matching, same as BallRoller/ctrl --
#                              character identity unreviewed), pairwise_distance_mae_pct
#                              null (single usable anchor, see above).
#
#   ChessBoard/walk_third (added 2026-08): a fresh capture, not a re-analysis of an
#                              existing case. Built a standalone macOS Player of
#                              GameScenes/ChessBoardwithSphere's real scene
#                              (`Assets/Scenes/Chess Demo.unity`, NOT the empty
#                              `SampleScene.unity` decoy) with a runtime capture
#                              MonoBehaviour (`Assets/Scripts/ChessCaptureBootstrap.cs`,
#                              left uncommitted in the scene repo) that drives a
#                              scripted 90-frame/3s third-person walk-turn-sprint-jump
#                              rollout of the PlayerArmature humanoid and logs, per
#                              frame, the camera-to-world matrix (CV convention: x
#                              right, y down, z forward -- built directly from
#                              Camera.transform.right/-up/forward, matching this
#                              module's `pc = w2c @ [x,y,z,1]` pinhole formula),
#                              intrinsics derived from the real runtime vertical FOV
#                              and 640x360 resolution, and the world position of the
#                              scene's reflective "sphere" plus 4 further-background
#                              decorative king statues that turned out to be out of
#                              frame for this entire rollout (King_Gold/Wood/Metal/
#                              Marble -- real Edit-mode-read positions, kept in the
#                              capture log but not used as anchors since they're never
#                              actually visible in these frames). `ScreenCapture.
#                              CaptureScreenshotAsTexture()` returns null in this
#                              batchmode standalone-Player context (no window
#                              backbuffer to grab, confirmed empirically -- a genuinely
#                              new finding this session, distinct from the earlier
#                              Editor-Play-mode rendering blocker); fixed by rendering
#                              Main Camera into an explicit RenderTexture via ReadPixels
#                              instead. Also found and fixed a real input-driving bug:
#                              PlayerArmature ships with an ML-Agents DecisionRequester
#                              that periodically overwrites scripted input with
#                              PlayerAgent.Heuristic()'s all-zero Keyboard.current
#                              reading (no real keyboard in batchmode) -- disabled at
#                              capture-script startup so the scripted walk actually
#                              moves the character (confirmed visually: player x/z and
#                              camera dolly both change frame-to-frame; before the fix
#                              they were frozen every frame despite driven input).
#                              Reprojection self-check (before trusting anything):
#                              projected the logged "sphere" world position through the
#                              logged pose/intrinsics for two independent frames (0 and
#                              60, genuinely different camera positions) and confirmed
#                              the predicted pixel visually lands inside the sphere's
#                              rendered disk both times; cross-validated independently
#                              via a real GroundingDINO "sphere." detection on frame 0,
#                              whose top-scoring box center (306.4, 154.6) landed within
#                              ~2px of the analytical reprojection (306.9, 152.9).
#                              Self-consistency check (candidate = reference video, all
#                              90 frames): object_permanence_pct 100.0,
#                              character_consistency_pct 43.33 (eoc_character_prompt
#                              "person." -- a real, intentionally-reviewed character
#                              check, unlike BallRoller/ctrl's/MirrorRollingBall's
#                              disabled-character scope), depth_absrel_pct 91.85%
#                              (self-match error -- same real-world-trained monocular
#                              depth-model domain-gap bias documented above, on the
#                              higher end of the range seen across cases so far),
#                              pairwise_distance_mae_pct null (single usable anchor --
#                              same structural limitation as MirrorRollingBall/
#                              RacingCar; the other 4 King_* statues are real objects
#                              with real positions but never enter frame in this
#                              rollout, so they cannot serve as a second anchor here).
#   kinematics_mechanics       LIVE (BallRoller/ctrl only) as of 2026-08. Paper
#                              appendix B.3, scoped to the case's static "dome"/"cube"
#                              obstacles (2D pixel-space FDE/DTW proxy, not the
#                              paper's full 3D metric -- see module docstring).
#                              "ramp" is excluded: it doesn't survive ByteTrack
#                              (weakest/most ambiguous detection of the 3 static
#                              objects -- wedge shape, worst pose-fit residual).
#                              FDE: dome 27.8px, cube 25.2px (down from >1700px
#                              before the camera-pose fix below). The case's moving
#                              ball remains excluded -- its trajectory ground truth is
#                              a separate, still-unresolved data-provenance question
#                              (see PENDING.md).
#
#   Camera-pose fix behind both of the above (2026-08): the case's shipped
#   `poses.npy` turned out to have TWO real problems, not one -- its rotation was
#   identity at every frame (already known), AND its implied camera translation
#   (the Editor-authored static Main Camera transform, (0,18,-20)) was also wrong.
#   Recovered the camera's real 6-DOF pose (position + rotation) via least-squares
#   reprojection-error minimization against 4 real 3D-2D correspondences (ramp,
#   dome, cube, ball -- all independently cross-validated: GroundingDINO box-centers
#   agreed with an independent VLM-judge center estimate within 1-13px, ruling out
#   detection noise as the error source). This is genuinely overdetermined (8
#   constraint equations, 6 unknowns), unlike two earlier, explicitly-rejected
#   attempts that used only 2-3 points held against the WRONG fixed translation
#   (both failed decisively on held-out validation -- see PENDING.md for that full,
#   preserved history). Residual on the 4-point fit: 20-70px per point (worst:
#   ramp). Recovered pose lives at
#   `cases/BallRoller/ctrl/reference/artifacts/poses_recovered.npy` -- the ORIGINAL
#   shipped `poses.npy` is left untouched (other dimensions, e.g.
#   action_controllability, still reference it). Known simplification: this is ONE
#   static pose applied across the whole 173-frame clip, not per-frame; the
#   original poses.npy implied a small real camera drift this doesn't model.
#   scene_character_consistency  Paper B.1's full CHARACTER-identity half on a
#                              dedicated character scene -- distinct from the
#                              "player" ball check above, still fully blocked:
#                              WanderingGarden (the paper-mapped scene) has zero
#                              case data.
#   (physical_causality and fluid_mechanics moved out of this list on
#   2026-09-18 — both are now live; see the dated banner at the top.)
suite_name: WMEval Lite
version: v1
description: Unity-free evaluation bundle. Reference videos and artifacts are shared across dimensions; each dimension applies its own metrics.
dimensions:
  lpips:
    display_name: LPIPS (causal)
    description: Collision/contact timing via reference-first causal LPIPS.
    evaluator: registry
    requires_reference: true
    modules:
    - lpips
    metric_config:
      lpips_sampling: causal_vlm_collision
      # reference-only event detection undershot causal LPIPS on some
      # candidates; switched to both (the runner's own default) after
      # verifying it closes the gap with no regression elsewhere.
      lpips_causal_event_source: both
      eval_fps: 4.0
      max_pairs: 32
      # fine judge + side relabel model, and coarse-window model: gpt-5.4-mini
      # for the coarse pass, gpt-5.4 for the fine judge and side relabel --
      # not the gpt-4o runner default.
      lpips_vlm_model: gpt-5.4
      lpips_vlm_coarse_model: gpt-5.4-mini
    cases:
    - MirrorRollingBall/lpips_collision
    - BeamDomino/causal
    - LiquidContainer/fluid_rest
    - LiquidContainer/fluid_step_hold
    - LiquidContainer/fluid_impulse_decay
    - LiquidContainer/fluid_chirp_strafe
    aggregate:
      headline: lpips_mean
      direction: lower
      extra_means:
      - lpips_median
  action_controllability:
    display_name: Action Controllability
    description: Action-following motion via RAFT and optional synthetic-flow control_motion.
    evaluator: registry
    requires_reference: true
    modules:
    - control_motion
    metric_config:
      control_camera_compensation: true
      control_global_motion_mode: median_translation
      control_bad_pixel_thresholds:
      - 1.0
      - 3.0
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    - BeamDomino/causal
    aggregate:
      headline: epe_dynamic_mean_compensated
      direction: lower
      extra_means:
      - epe_mean_raw
      - bad_pixel_rate_1px_mean
      - bad_pixel_rate_3px_mean
      # Relative (scale-normalized) EPE and directional cosine similarity on
      # dynamic-region flow -- control_motion.py always computed these but
      # aggregate.py never extracted them past full_report until now. Left as
      # extra_means rather than promoted to headline: cosine similarity's
      # natural direction is "higher", opposite this dimension's "lower", so
      # changing the headline is a bigger call than this fix's scope.
      - relative_epe_dynamic_mean_raw
      - cosine_similarity_dynamic_mean_raw
  prompt_scene_consistency:
    display_name: Prompt-Scene Consistency
    description: Prompt-scene semantic consistency via the dual-agent (environment+object) VLM judge; reference-free (first frame only).
    evaluator: vlm_consistency
    requires_reference: false
    vlm:
      provider: openai
      model: gpt-5.4
      # v0 = the formal rubric set (2026-05-06) used for the human study and
      # results_v0; the rubric files are copied byte-for-byte, so each case's
      # rubric_scene_name keeps that set's scene names (RollingBall_first, ...).
      prompt_version: v0
      alpha: 0.6
      # case-relative: rubrics live inside each case's checksummed bundle
      rubric_dir: reference/artifacts/rubrics
    cases:
    - MirrorRollingBall/prompt_first
    - MirrorRollingBall/prompt_third
    - RacingCar/prompt_first
    - RacingCar/prompt_third
    - ChessBoard/prompt_first
    - ChessBoard/prompt_third
    aggregate:
      headline: overall_score
      direction: higher
      extra_means:
      - env_score
      - obj_score
  lighting_shading:
    display_name: Lighting & Shading
    description: 'Reference-free lighting/shadow physics: GroundingDINO + SAM2 tracking with Hu-moment shape signatures (SRR/SDR/MOSD/SDJ/SAS/SSD) under the paper''s first-person, fixed-sun, walking-orbit regime. Live on its paper-target scene SunRisesAndSets/lighting since 2026-09-15 (see the dated banner above for provenance and the analytic geometry floor); ChessBoard/lighting is still pending a team decision (PENDING.md).'
    evaluator: registry
    requires_reference: false
    modules:
    - shadow_consistency
    metric_config:
      eval_fps: 24.0
      max_pairs: 0
    # first-person (the paper's lighting regime). Per-candidate
    # shadow_hud_preset comes from model.yaml / manifest params, not the case.
    cases:
    - SunRisesAndSets/lighting
    aggregate:
      headline: shadow_direction_jitter_deg_per_frame
      direction: lower
      extra_means:
      - scene_retention_rate_pct
      - shadow_detection_rate_pct
      - multi_object_sun_disagreement_deg
      - shadow_area_stability_pct
      - shadow_shape_drift
  environment_object_consistency:
    display_name: Environment Object Consistency
    description: >-
      Paper B.1, object + character halves: GroundingDINO + SAM2 tracking
      for depth AbsRel / pairwise-distance MAE against Unity-analytical
      ground truth, reference-free object permanence, and reference-free
      DINOv2 character-identity consistency. Per-case scoping (which
      anchors, which prompts, why) and every real self-match number are
      NOT duplicated here to avoid a second, driftable copy -- see this
      file's dated header banners (search "==...==") for the numbers as of
      each fix, and PENDING.md for the full per-case narrative writeups.
      One structural note that belongs here rather than in a dated banner:
      BallRoller/ctrl and RacingCar/prompt_third's character_consistency_pct
      is deliberately noise, not signal (eoc_character_prompt is an
      intentionally non-matching string on those two cases; GroundingDINO
      still occasionally fires a spurious low-confidence box even for a
      nonsense prompt).
    evaluator: registry
    requires_reference: true
    modules:
    - environment_object_consistency
    metric_config:
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    - RacingCar/prompt_third
    - ChessBoard/walk_third
    - WanderingGarden/scene_first
    # Table 7 cells (tools/build_table_lite_cases.py)
    - WanderingGarden/scene_perturb_in
    - WanderingGarden/scene_perturb_out
    - WanderingGarden/scene_360_in
    - WanderingGarden/scene_360_out
    - BilliardGame/scene_perturb_in
    - BilliardGame/scene_perturb_out
    - BilliardGame/scene_360_in
    - BilliardGame/scene_360_out
    - MirrorRollingBall/scene_perturb_in
    - MirrorRollingBall/scene_perturb_out
    - MirrorRollingBall/scene_360_in
    - MirrorRollingBall/scene_360_out
    aggregate:
      headline: object_permanence_pct
      direction: higher
      extra_means:
      - depth_absrel_pct
      - pairwise_distance_mae_pct
      - character_consistency_pct
  kinematics_mechanics:
    display_name: Kinematics & Mechanics
    description: 'Paper B.3: GroundingDINO + ByteTrack trajectory reconstruction against timestamp-matched Unity trajectories. For calibrated planar Table-4 captures, candidate contact points are mapped into Unity X/Z metres by camera-ray/plane intersection; FDE and path-normalized DTW are reported in metres, with raw pixel diagnostics retained. Simulator-exported mass and a bounded, persistence-gated alignment of peak physical events feed momentum and kinetic energy using the paper''s one-step finite difference. Error Rate is the sole headline mechanics metric. Visual anchors remain a camera-divergence QA signal and do not redefine metric scale. Non-planar legacy Lite cases without plane calibration retain their prior pixel/depth diagnostic behavior.'
    evaluator: registry
    requires_reference: true
    modules:
    - kinematics_mechanics
    metric_config:
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    # Table 4 cells (tools/build_table_lite_cases.py)
    - RacingCar/kinematics_third
    - BilliardGame/kinematics_first
    aggregate:
      headline: fde_m_mean
      direction: lower
      extra_means:
      - dtw_m_mean
      - error_rate_pct
      - fde_px_mean
      - dtw_px_mean
  physical_causality:
    display_name: Physical Causality
    description: >-
      Paper B.6 / App. C.5, CausalStep stepwise QA on BeamDomino's
      ROLLING -> IMPACT -> TOPPLE -> CASCADE chain. A shared VLM judge grades
      the same QA twice -- once on the Unity reference, once on the candidate --
      and every metric is reported as a {unity, wm, delta} triple, so a question
      the judge fails on the reference is visibly uninformative about the world
      model. Sign convention (evaluation/modules/_causal_step_delta.py):
      positive delta always means the world model is worse than Unity.
      All three trajectory shapes the paper reports are wired, each graded with
      its own shape-specific QA chain (canonical / glancing / direct_strike), so
      a physically valid non-canonical outcome is not penalised by questions that
      assume the canonical chain.
      `causal_step_vlm_num_frames: 8` is deliberate and load-bearing, not a
      default: App. D.2 treats judge frame sampling as a benchmark
      hyper-parameter and measures the Unity reference itself at CSR 53% (K=4)
      vs 87% (K=8) on tight segments. Do not lower it without re-reading that
      section. `causal_step_vlm_model: gpt-5.4` is pinned for PROVENANCE, not
      because it measurably beats the cheaper model: the published Table 7
      numbers were produced with full `gpt-5.4`, so that is what this dimension
      pins. On the 19 bundled QA items the two models cannot in fact be
      separated at n=1 -- `gpt-5.4-mini` disagrees with a published `gpt-5.4`
      pass on 3/19 items, while a second `gpt-5.4` pass under the identical
      config disagrees with it on 4/19. Judge noise exceeds the model effect.
      Pick a different judge model if you have reason to, but re-baseline rather
      than assuming a one-run comparison shows anything.
      `csr_unity` is carried in extra_means because the reference side is NOT
      saturated -- the GLANCE sub-event in particular is hard for the judge to
      resolve from sampled frames even on simulator-rendered video, so part of
      any delta on that shape is reference-side difficulty rather than
      world-model error.
      REPEATED JUDGE PASSES. CSR is all-or-nothing per video
      (`max_chain_length >= num_segments`, causalstep/metrics.py), so ONE judge
      pass over a case -- which bundles one video -- can only ever report csr 0
      or 100, and the judge is not reproducible at temperature 0 (two runs of
      this exact config differ on 4 of 19 items; `glancing` has been observed at
      both 0 and 100). `causal_step_judge_repeats: 5` is what makes the reported
      numbers match the paper's cell semantics: CSR over five passes is
      successes/5, which is how the published per-shape reference figures land
      at clean 100, far 100, glancing 60 (= 3/5). Lower it and csr becomes a
      coin flip again; amcl/ws/dua/icra degrade gracefully either way.
      THE REFERENCE SIDE IS A FIXTURE, NOT A RUN. When a case ships
      `reference/artifacts/judge_answers.json`, the reference side replays those
      recorded passes instead of calling the judge -- zero API cost, and
      csr_unity stops moving between runs. The recording carries the settings
      that produced it, and its pass count sets the default repeat count. Record
      or re-record with:
        python tools/record_causal_reference_answers.py <case_dir> --passes 5
      A case with no recording still runs; it just pays the live judge on both
      sides. This mirrors what the liquid dimension already does with its SAM2
      and RAFT `.npz` artifacts.
      `causal_step_wm_full_video` now defaults to TRUE, which is App. C.5's
      published protocol: the candidate is scored over its whole clip while the
      reference stays segment-windowed, because world-model rollouts are not
      frame-aligned to the Unity log. The paper is explicit that this asymmetry
      slightly favours the candidate and makes Table 7's deltas upper bounds.
      The one case where it is wrong is an identical pair -- asking the two
      sides different questions about the same file reported csr_delta = 100.0
      on a self-pair -- so causal_step detects byte-identical candidate and
      reference and forces segment windowing, reporting `wm_full_video_reason`
      when it does. Set it to false explicitly for a candidate you know IS
      frame-aligned to Unity.
    evaluator: registry
    requires_reference: true
    modules:
    - causal_step
    metric_config:
      causal_step_judge: openai
      causal_step_vlm_model: gpt-5.4
      causal_step_vlm_num_frames: 8
      causal_step_judge_repeats: 5
      causal_step_answers_cache_dir: runs/causal_step_cache
    cases:
    - BeamDomino/causal
    - BeamDomino/causal_glancing
    - BeamDomino/causal_direct_strike
    aggregate:
      # csr_delta matches Table 7's leading column. It is only meaningful
      # because `causal_step_judge_repeats: 5` makes CSR a mean over five
      # passes: CSR is all-or-nothing per video, so at one pass it can report
      # only 0 or 100. amcl_delta is carried below as the ungated companion.
      headline: csr_delta
      direction: lower
      # mcl_delta is deliberately NOT listed: B.6 defines MCL as the longest
      # subchain across VIDEOS, but with one video graded over N passes the
      # max runs over judge passes instead, biased above the single-trajectory
      # value. Every other metric here averages over passes and stays
      # coherent. mcl_{unity,wm,delta} remain in each case's full report.
      extra_means:
      - csr_unity
      - amcl_delta
      - ws_delta
      - rf_delta
      - dua_delta
      - icra_delta
  fluid_mechanics:
    display_name: Fluid Mechanics
    description: >-
      Paper B.4, sealed-bottle sloshing on LiquidContainer under the fixed
      side-camera regime (c2_static_side) so bottle motion is bottle-induced
      rather than camera-induced. Four modules read a shared SAM2 mask pair
      (liquid + bottle) and a pooled RAFT flow field; all four reference-side
      artifacts ship inside each case bundle as portable .npz, so a run only
      ever executes SAM2/RAFT on the candidate, never on the reference.
      The four action profiles stress different regimes: `rest` is the
      zero-action control for hallucinated motion, `step_hold` a sustained
      tilt-and-decay, `impulse_decay` two isolated ring-downs, `chirp_strafe`
      a 0.3->3.0 Hz sweep through the liquid's resonant modes.
      HEADLINE CAVEAT: App. D.1 states outright that LiquidContainer "cannot be
      summarised by any single scalar" -- the five axes measure approximately
      orthogonal failure modes and the per-profile leaderboard re-orders sharply
      versus the pooled one. `velocity_cosine_similarity` is the headline only
      because it is Table 5's leading column; read extra_means alongside it, and
      prefer the per-case breakdown over this scalar. Note also that RAFT
      magnitudes inside an opaque, textureless liquid are estimator-noise
      dominated (App. D.1), which is why cosine rather than EPE/divergence/curl
      is surfaced at all. The dominant-frequency channel is deliberately NOT
      promoted here: B.4 demotes it to a per-pair diagnostic because the
      meniscus FFT peak is not uniquely defined under multi-mode sloshing on
      chirp_strafe; `spectral_l1` is the surviving spectral statistic.
    evaluator: registry
    requires_reference: true
    modules:
    - liquid_velocity
    - liquid_volume_conservation
    - liquid_surface_orientation
    - slosh_spectrum
    metric_config:
      liquid_cache_root: runs/liquid_cache
      liquid_sam2_model: facebook/sam2.1-hiera-small
      liquid_sam2_prompt: the liquid inside the bottle
      liquid_bottle_prompt: the glass bottle
      liquid_piv_window_size: 32
      liquid_piv_overlap: 16
      liquid_flow_min_mask_frac: 0.5
      liquid_flow_estimator: raft
      # Scopes to the velocity field, the one place C.4 specifies it ("the
      # bottle bulk velocity ... is subtracted from every flow vector"). The
      # slosh trace is mean-centered only, per B.4.
      liquid_camera_compensation: true
      liquid_camera_regime: c2_static_side
      liquid_max_pairs: 0
    cases:
    - LiquidContainer/fluid_rest
    - LiquidContainer/fluid_step_hold
    - LiquidContainer/fluid_impulse_decay
    - LiquidContainer/fluid_chirp_strafe
    aggregate:
      headline: velocity_cosine_similarity
      direction: higher
      # Tables 5/11 print `dsigma_A` signed but `|dAdot|` and `|dtheta_rms|`
      # absolute, and pooling signed deltas across the four action profiles
      # cancels. The *_abs_delta columns are the paper's; the signed ones are
      # kept alongside because they carry the direction the absolute discards.
      extra_means:
      - mask_area_std_normalized_delta
      - mask_area_drift_per_sec_abs_delta
      - surface_tilt_residual_deg_abs_delta
      - spectral_l1
      - mask_area_drift_per_sec_delta
      - surface_tilt_residual_deg_delta
      - surface_tilt_residual_deg_unity
