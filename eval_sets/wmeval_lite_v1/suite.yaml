  environment_object_consistency:
    display_name: Environment Object Consistency
    description: >-
      Paper B.1, object + character halves: GroundingDINO + SAM2 tracking
      for depth AbsRel / pairwise-distance MAE against Unity-analytical
      ground truth, reference-free object permanence, and reference-free
      DINOv2 character-identity consistency. Per-case scoping (which
      anchors, which prompts, why) and every real self-match number are
      NOT duplicated here to avoid a second, driftable copy -- see this
      file's dated header banners (search "==...==") for the numbers as of
      each fix, and PENDING.md for the full per-case narrative writeups.
      One structural note that belongs here rather than in a dated banner:
      BallRoller/ctrl and RacingCar/prompt_third's character_consistency_pct
      is deliberately noise, not signal (eoc_character_prompt is an
      intentionally non-matching string on those two cases; GroundingDINO
      still occasionally fires a spurious low-confidence box even for a
      nonsense prompt).
    evaluator: registry
    requires_reference: true
    modules:
    - environment_object_consistency
    metric_config:
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    - MirrorRollingBall/prompt_third
    - RacingCar/prompt_third
    - ChessBoard/walk_third
    - WanderingGarden/scene_first
    - BilliardGame/prompt_first
    aggregate:
      headline: object_permanence_pct
      direction: higher
      extra_means:
      - depth_absrel_pct
      - pairwise_distance_mae_pct
      - character_consistency_pct
  kinematics_mechanics:
    display_name: Kinematics & Mechanics
    description: 'Paper B.3: GroundingDINO + ByteTrack trajectory reconstruction, 2D pixel-space FDE/DTW proxy (not the paper''s full 3D metric -- see module docstring) against Unity ground truth reprojected through a (recovered or shipped) camera pose. BallRoller/ctrl is scoped to its static "dome"/"cube" obstacles (zero velocity by construction, "ramp" excluded -- doesn''t survive ByteTrack); needed a recovered 6-DOF camera pose (~20-70px residual, see suite.yaml header). RacingCar/prompt_third is scoped to its stationary parked "car" (also zero velocity by construction); needed only a small physically-sensible 3D offset correction to the case''s already-real, already-correct shipped poses.npy (car Transform pivot vs. visual body-center height, ~15-23px residual after correction) -- FDE 19.41px self-match across all 300 frames. Both cases''s own ground truth is static-anchor-only: BallRoller/ctrl''s ball has a separate, unresolved data-provenance conflict (see PENDING.md); RacingCar/prompt_third''s car never moves in this rollout at all (a genuinely static parked-car shot). BilliardGame/prompt_first (added 2026-08) is the FIRST genuinely moving-object case in this dimension: its "yellow ball" is struck by the cue ball and rolls/collides for real, and "red ball" is a real static second anchor (see environment_object_consistency description above for the capture pipeline); this is also its paper-primary dimension per Table 10 + the Sec 4.2 results narrative (the paper explicitly compares Billiard Game vs Racing Car here), not environment_object_consistency. **Real bug found and fixed 2026-08**: the first wiring attempt gave dtw_px 3451.6 for "yellow ball", which turned out to be a genuine ByteTrack identity swap, not metric noise -- GroundingDINO''s "yellow ball." prompt falsely fired on the WHITE cue ball once it came to rest near the yellow ball''s start position (confirmed by reprojecting all 3 balls'' real positions: the wrongly-tracked pixels matched Ball_0, not Ball_1, for ~106 frames), and the module''s track-merging logic blindly concatenated the resulting track segments without checking they were the same physical object. Fixed via a new HSV color-consistency filter (`kin_color_filter`, opt-in) that locks each label''s color signature from its first detection and rejects same-label detections that don''t match; also added `kin_track_thresh: 0.3` (same fix class as BallRoller). Post-fix self-match: yellow ball fde_px 0.25 / dtw_px 26.4 (44/150 frames survive the color filter -- the rest are correctly rejected as ambiguous/occluded rather than silently mistracked); red ball fde_px 0.29 / dtw_px 52.0 (144/150 frames, near-static so easy). mechanical_quantities (momentum/kinetic-energy exact-match, the paper''s other B.3 headline metric) is now REAL and WIRED (new `kin_depth_lift` opt-in flag: lifts the tracked pixel centroid to a metric 3D point via the same monocular depth model B.1 uses + known camera intrinsics, differences the last two tracked frames for terminal velocity, per Eq 11-13) but the resulting numbers are not yet usable: error_rate_pct is 381% (yellow ball) to 141,129% (red ball, whose near-zero ground-truth speed blows up the relative-error denominator). Root cause: a 2-point finite-difference velocity estimate is extremely sensitive to per-frame depth-map noise; a real fix needs multi-frame smoothing (e.g. a short linear/parabolic fit across several tracked frames instead of a raw 2-point difference), not yet implemented. Treat momentum/energy numbers as "wired but not yet trustworthy" -- exact-match/error-rate are computed and present in every case''s output, but should not be read as real signal until the velocity-estimation noise is addressed.'
    evaluator: registry
    requires_reference: true
    modules:
    - kinematics_mechanics
    metric_config:
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    - RacingCar/prompt_third
    - BilliardGame/prompt_first
    aggregate:
      headline: fde_px_mean
      direction: lower
      extra_means:
      - dtw_px_mean
