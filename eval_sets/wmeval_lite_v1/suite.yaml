# Combined with the earlier GroundingDINO caching fix, BilliardGame's full
# kinematics_mechanics eval now completes in ~155 seconds (timed, real
# run) -- down from the 15-25+ minutes typical of every eval run earlier
# this session. Full writeup in PENDING.md.
