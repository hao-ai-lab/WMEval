# WMEval Lite suite manifest — hand-maintained single source of truth.
# (Edit as text; do not regenerate with a YAML round-trip, it strips comments.)
#
# Target scene x dimension mapping (paper, 2026-07-08):
#   ChessBoard        -> prompt_scene_consistency, lighting_shading      (data pending)
#   BallRoller        -> kinematics_mechanics, action_controllability
#   RacingCar         -> kinematics_mechanics, prompt_scene_consistency
#   MirrorRollingBall -> lpips, prompt_scene_consistency
#   WanderingGarden   -> scene_character_consistency                     (data pending)
#   SunRisesAndSets   -> lighting_shading                                (data pending)
#   LiquidContainer   -> fluid_mechanics                                 (data pending, PR #19 artifacts)
#   BeamDomino        -> physical_causality (cases/BeamDomino/causal is earmarked
#                        for it: the rollout is the full causal chain; needs qa_dataset)
#   BilliardGame      -> (in the scene roster but unmapped — confirm with team)
#
# Dimensions not yet wired (add here when ready):
#   kinematics_mechanics       registry `motion` module proposed; either own rollouts
#                              (BallRoller/kinematics, RacingCar/kinematics) or borrow
#                              BallRoller/ctrl + RacingCar/prompt_third (whose bundled
#                              unity_groundtruth.mp4 would be declared reference.video)
#                              — pending team confirmation.
#   scene_character_consistency  WanderingGarden/scene_first + scene_third — pending data
#                              + judge config.
#   physical_causality         BeamDomino/causal (earmarked) + qa_dataset; more strike
#                              variants (causal_glancing, ...) as data lands — PR #19.
#   fluid_mechanics            LiquidContainer/fluid_rest, fluid_step_hold,
#                              fluid_impulse_decay, fluid_chirp_strafe — pending PR #19
#                              .npz reference artifacts.
suite_name: WMEval Lite
version: v1
description: Unity-free evaluation bundle. Reference videos and artifacts are shared across dimensions; each dimension applies its own metrics.
dimensions:
  lpips:
    display_name: LPIPS (causal)
    description: Collision/contact timing via reference-first causal LPIPS.
    evaluator: registry
    requires_reference: true
    modules:
    - lpips
    metric_config:
      lpips_sampling: causal_vlm_collision
      lpips_causal_event_source: reference
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - MirrorRollingBall/lpips_collision
    aggregate:
      headline: lpips_mean
      direction: lower
      extra_means:
      - lpips_median
  action_controllability:
    display_name: Action Controllability
    description: Action-following motion via RAFT and optional synthetic-flow control_motion.
    evaluator: registry
    requires_reference: true
    modules:
    - control_motion
    metric_config:
      control_camera_compensation: true
      control_global_motion_mode: median_translation
      control_bad_pixel_thresholds:
      - 1.0
      - 3.0
      eval_fps: 4.0
      max_pairs: 32
    cases:
    - BallRoller/ctrl
    aggregate:
      headline: epe_dynamic_mean_compensated
      direction: lower
      extra_means:
      - epe_mean_raw
      - bad_pixel_rate_1px_mean
      - bad_pixel_rate_3px_mean
  prompt_scene_consistency:
    display_name: Prompt-Scene Consistency
    description: Prompt-scene semantic consistency via the dual-agent (environment+object) VLM judge; reference-free (first frame only).
    evaluator: vlm_consistency
    requires_reference: false
    vlm:
      provider: openai
      model: gpt-5.4
      prompt_version: v1
      alpha: 0.6
      # case-relative: rubrics live inside each case's checksummed bundle
      rubric_dir: reference/artifacts/rubrics
    # Target adds ChessBoard first/third once its data lands.
    cases:
    - MirrorRollingBall/prompt_first
    - MirrorRollingBall/prompt_third
    - RacingCar/prompt_first
    - RacingCar/prompt_third
    aggregate:
      headline: overall_score
      direction: higher
      extra_means:
      - env_score
      - obj_score
  lighting_shading:
    display_name: Lighting & Shading
    description: 'Reference-free lighting/shadow physics: GroundingDINO + SAM2 tracking with Hu-moment shape signatures (SRR/SDR/MOSD/SDJ/SAS/SSD). TEMPORARY cases: target mapping moves this dimension to ChessBoard/third + SunRisesAndSets/third once their data lands.'
    evaluator: registry
    requires_reference: false
    modules:
    - shadow_consistency
    metric_config:
      eval_fps: 24.0
      max_pairs: 0
    # third-person only; TEMPORARILY borrowing prompt_scene_consistency's videos
    # (variant names the owning dimension; the borrow shows in the matrix)
    cases:
    - MirrorRollingBall/prompt_third
    - RacingCar/prompt_third
    aggregate:
      headline: shadow_direction_jitter_deg_per_frame
      direction: lower
      extra_means:
      - scene_retention_rate_pct
      - shadow_detection_rate_pct
      - multi_object_sun_disagreement_deg
      - shadow_area_stability_pct
      - shadow_shape_drift
legacy_case_aliases:
  lpips:
    mirror_ball_third_person: MirrorRollingBall/lpips_collision
    sample_scene: MirrorRollingBall/lpips_collision
    sample_scene_third_person: MirrorRollingBall/lpips_collision
    mirror_ball: MirrorRollingBall/lpips_collision
    mirror_ball/third_person: MirrorRollingBall/lpips_collision
    MirrorRollingBall/third_collision: MirrorRollingBall/lpips_collision
  action_controllability:
    ball_roller_third_person: BallRoller/ctrl
    ball_roller: BallRoller/ctrl
    ball_roller/third_person: BallRoller/ctrl
    BallRoller/third: BallRoller/ctrl
  prompt_scene_consistency:
    mirror_rolling_ball/first: MirrorRollingBall/prompt_first
    mirror_rolling_ball/third: MirrorRollingBall/prompt_third
    racing_car/first: RacingCar/prompt_first
    racing_car/third: RacingCar/prompt_third
    MirrorRollingBall/first: MirrorRollingBall/prompt_first
    MirrorRollingBall/third: MirrorRollingBall/prompt_third
    RacingCar/first: RacingCar/prompt_first
    RacingCar/third: RacingCar/prompt_third
  lighting_shading:
    mirror_rolling_ball/third: MirrorRollingBall/prompt_third
    racing_car/third: RacingCar/prompt_third
    MirrorRollingBall/third: MirrorRollingBall/prompt_third
    RacingCar/third: RacingCar/prompt_third
