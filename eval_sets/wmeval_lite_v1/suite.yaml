# 2026-08-27 (second follow-up): a GENUINE fix for mechanical_quantities'
# near-zero-baseline blowup, not just diagnostics -- the user correctly
# pushed back that flagging the problem isn't the same as fixing it, and
# noted the paper's Eq 13 (as literally written) may simply be missing the
# information needed to evaluate a near-motionless object sensibly, so
# extending the evaluation beyond the paper's literal formula was
# explicitly authorized.
#
# TWO real changes, both in kinematics_mechanics.py:
#
# (a) Reference-scale normalization. Eq 13 divides error by |q_gt| AT THE
# INSTANT BEING EVALUATED -- fine when that instant has real motion, but
# nonsensical when it doesn't, regardless of how small the absolute error
# is. New `error_rate_pct_normalized` instead divides by this object's own
# PEAK momentum/energy across its FULL ground-truth trajectory (computed
# from real per-frame-pair GT velocities, not the evaluation window) -- a
# stable, physically meaningful scale for objects that do move somewhere
# in the clip, while correctly reporting `None` (not a smaller-but-still-
# fake number) for objects whose peak speed never exceeds
# NEAR_ZERO_PEAK_SPEED_M_S = 0.01 m/s anywhere -- those are genuinely
# never in motion, and no error formula can give a real answer for "how
# accurate is the momentum of something that has none."
#
# (b) A genuine second evaluation stage. The paper gives "terminal
# momentum magnitude" only as an *example* metric (Sec B.3: "such as
# terminal momentum magnitude or kinetic energy"), not the sole
# prescribed instant -- evaluating only the terminal (possibly-resting)
# window can simply miss where an object's real dynamics happened. New
# `peak_motion` stage evaluates around the object's own fastest
# ground-truth instant instead, reported alongside (not instead of)
# `terminal`. `_mechanics_stage()` computes both from the same
# depth-lifted, linear-fit-smoothed velocity pipeline already used for
# `terminal`.
#
# REAL, END-TO-END-VERIFIED result on BilliardGame/prompt_first (before ->
# after, all `error_rate_pct_normalized`, i.e. the new headline number):
#   yellow ball (genuinely struck and moving; peak_speed 5.83 m/s):
#     terminal   momentum 23.25%(Eq13 raw)  -> 1.95%   (normalized)
#     terminal   energy   41.09%(Eq13 raw)  -> 0.29%   (normalized)
#     peak_motion momentum 11,719%(Eq13 raw) -> 29.05%  (normalized)
#     peak_motion energy   1,323,489%(Eq13 raw) -> 8.58% (normalized)
#   red ball (genuinely never hit; peak_speed 0.0053 m/s, below the
#   0.01 m/s "ever really moves" threshold):
#     error_rate_pct stays astronomical (15,159%-1,950,188%, Eq 13's own
#     formula, kept unmodified for paper fidelity) but
#     error_rate_pct_normalized is now cleanly `None` with an explanatory
#     `error_rate_pct_normalized_note`, not a fabricated smaller number --
#     `absolute_errors` (a few hundredths of a kg*m/s or J) is the only
#     number that's actually meaningful for an object with no real motion
#     to measure.
#
# POST-FIX SANITY CHECK found and fixed 3 real bugs in the above, all
# introduced this round (not pre-existing): (1) pairwise_distance_mae_pct
# silently kept using monocular-depth 3D points even for apparent-size-
# covered labels -- fixed, see PENDING.md; (2) the reference_scale.note
