schema_version: 1
trajectory_id: controllability.beam_domino.clean_strike_v1
description: >-
  Force-input control of the blue ball: a brief pause, then a straight forward
  roll into the nearest front-right pillar, then no steering while the structure
  collapses. Also the commanded action of BeamDomino/causal for physical
  causality. Spans the 12.1 s Unity reference.
duration_sec: 12.1
control_hz: 10
channels:
  horizontal: {kind: continuous, min: -1.0, max: 1.0, unit: normalized_force_input}
  vertical: {kind: continuous, min: -1.0, max: 1.0, unit: normalized_force_input}
segments:
  - {start_sec: 0.0, end_sec: 2.0, values: {horizontal: 0.0, vertical: 0.0}}
  - {start_sec: 2.0, end_sec: 7.0, values: {horizontal: 0.0, vertical: 1.0}}
  - {start_sec: 7.0, end_sec: 12.1, values: {horizontal: 0.0, vertical: 0.0}}
paper_alignment:
  status: reconstructed
  matched: [scene, third_person_view, controlled_ball_motion, five_generations, metrics]
  missing: The paper does not publish its numeric action timeline.
  source: cases/BeamDomino/causal/reference/artifacts/actions.txt
  repository_context: >-
    Reproduces the deterministic 'clean' policy that drove the Unity capture
    (10 Hz decisions over 12.1 s): vertical is the z force (W/S) and horizontal
    the x force (D/A) of the same BallAgent-style two-axis force schema used by
    the other ball-control trajectories. The case's action.npy holds the same
    timeline as (z_force, x_force) rows.
adapters:
  unity: {status: ready, control_mode: ball_agent, channels: [horizontal, vertical]}
  project_genie:
    status: nominal
    note: The W/A/S/D mapping is browser-expressible; the generated world's key-to-force gain is not calibrated.
    key_rules:
      - {channel: horizontal, threshold: 0.25, positive_key: KeyD, negative_key: KeyA}
      - {channel: vertical, threshold: 0.25, positive_key: KeyW, negative_key: KeyS}
