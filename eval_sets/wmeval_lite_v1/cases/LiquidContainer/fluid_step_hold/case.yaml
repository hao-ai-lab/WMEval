prompt: 'A photorealistic outdoor daytime scene. The viewpoint is roughly at waist
  height, with a slight low-angle pitch, framing a single object at the center. The
  ground is a large flat checkerboard tile floor extending to the horizon, alternating
  light-grey and dark-grey squares; each tile is stamped with a small colored cross
  marker for visual texture and parallax. The background is a coastal Mediterranean
  vista: turquoise ocean horizon on the left, low coastal vegetation in the middle
  distance, and a row of white apartment buildings on the right. The sky is bright,
  partly cloudy, with blue skies and bright cumulus clouds. Lighting is soft, natural
  daylight from above and slightly to the right, casting a hard contact shadow on
  the floor directly under any object placed at the center of frame. Standard Earth
  gravity, downward. No people, no other props, no UI overlays, no text, no watermarks.


  A clear glass long-neck beer bottle with a glossy red cap, standing upright at the
  center of the frame. The bottle is 50% full of an opaque, dark liquid (cola-colored).
  The empty upper half is made of transparent glass, with subtle specular reflections
  of the sky. The bottle is rigid and behaves as a physical object: it rotates in
  response to control inputs but does not deform.


  The bottle rests for 2 s, is then strafed steadily to the right at full rate for
  8 s, and then rests again. The liquid should tilt into the sustained lateral acceleration
  and settle back once the motion stops.'
