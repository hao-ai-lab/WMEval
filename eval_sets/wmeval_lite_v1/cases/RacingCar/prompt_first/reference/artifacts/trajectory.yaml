schema_version: 1
trajectory_id: prompt.camera.left_turn_v1
description: Continuous left (counter-clockwise) camera turn of the prompt-scene consistency cases (hold ArrowLeft for 10 s); in place in first person, around the character in third person.
duration_sec: 10.0
control_hz: 20
channels:
  yaw_rate_deg_s: {kind: continuous, min: -360.0, max: 360.0, unit: deg_per_sec}
segments:
  - {start_sec: 0.0, end_sec: 10.0, values: {yaw_rate_deg_s: -40.0}}
paper_alignment:
  status: reconstructed
  matched: [ten_second_left_camera_turn, unity_reference_turn_rate]
  missing: The paper specifies a 10 s camera turn but no rate; 40 deg/s is the turn measured in every case's Unity reference poses.
  source: ../../../eval_sets/wmeval_lite_v1/cases/ChessBoard/prompt_first/reference/artifacts/poses.npy
adapters:
  unity: {status: reference, channel: yaw_rate_deg_s}
  project_genie:
    status: nominal
    key_rules:
      - {channel: yaw_rate_deg_s, threshold: 1.0, positive_key: ArrowRight, negative_key: ArrowLeft}
