  the floor, looking slightly down at the table. No body, hands, or held items are
  visible in frame. The viewer walks slowly and steadily counter-clockwise around
  a wooden round dining table at a constant radius of about 2.8 metres, completing
  one full loop over the duration of the clip while continuously keeping the table
  near the centre of the field of view. Smooth steady gait, no head bobbing, no jumping,
  no looking up at the sky, no looking down at the feet. Scene: on the table is a
  red toaster, a small dark mug, a white plate, a white bowl, a metal knife, and a
  tall white table lamp near the edge of the tabletop. Two wooden ladder-back chairs
  stand at the table. The floor is wooden planks. Lighting: a single bright sun shines
  from a fixed direction, high in the sky (about 68 degrees above the horizon), casting
  crisp directional shadows of the table, chairs, lamp, and tabletop objects onto
  the tabletop and the wooden floor. The sun does not move and the colour temperature
  does not change for the entire video.'
