    table: main-physical_causality.tex (tab:causal-physical-causality); n = 5 rollouts x 3 shapes. CSR 3/15 stored as a success rate (%) with the Bernoulli sample std; CausalStep deltas are unity - wm (positive = worse). Only Project Genie remains after the paper's drop.
    n: 15
    metrics: {csr: higher, d_amcl: lower, d_mcl: lower, d_ws: lower, d_dua: lower, d_icra: lower}
