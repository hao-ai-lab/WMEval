    table: holistic-lpips.tex (tab:worldmodel_causal_lpips); generations with no matched events are excluded
    n: 5
    metrics: {clpips: lower}
    cells:
      ball_roller: {clpips: {project_genie: [0.56, 0.02], lingbot_world: [0.38, 0.02]}}
      beam_domino: {clpips: {project_genie: [0.60, 0.02], lingbot_world: [0.61, 0.02]}}
      mirror_ball: {clpips: {project_genie: [0.72, 0.02], lingbot_world: [0.62, 0.05]}}
