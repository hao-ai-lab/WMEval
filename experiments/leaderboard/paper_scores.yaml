# Per-cell values transcribed from the paper tables (arxiv-WorldModel-Eval/table/*.tex,
# 2026-10-21 checkout, HEAD 438594a). Prompt-driven causality/fluid rows the paper drops
# (commented out in the .tex) are not transcribed.
#
# Value format: [mean, std] -- the sample std the table prints -- or a bare mean when the
# table gives no spread. `n` is the number of generations behind each cell (default 5).
# direction: higher | lower. Cells/metrics a model lacks are omitted (N/A).
schema_version: 2
source: arxiv-WorldModel-Eval/table/*.tex (2026-10-21 checkout, 438594a)
models:
  project_genie: {display: Project Genie}
  lingbot_world: {display: LingBot-World (Act), note: "Cam for consistency/prompt/lighting; Act for controllability/cLPIPS"}
  matrix_game_2: {display: Matrix-Game 2.0}
  matrix_game_3: {display: Matrix-Game 3.0}
  hy_worldplay: {display: HY-WorldPlay}
  waypoint15: {display: Waypoint-1.5}
dimensions:
