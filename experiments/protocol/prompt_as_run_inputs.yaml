# Prompt-scene consistency: the inputs each paper row was actually generated with.
#
# Every prompt case bakes the canonical trajectory prompt.camera.left_turn_v1
# (10 s left turn at the Unity reference's 40 deg/s; in place in first person,
# around the character in third person). The paper's rows predate it and were
# generated from per-model recipes, so models did not receive identical camera
# motion. Those rows are kept as-run (regenerating them would change paper
# scores); this file records the deviation. New models must compile
# prompt.camera.left_turn_v1 onto their controls (see the Lite README).
schema_version: 1
trajectory_id: prompt.camera.left_turn_v1
canonical: 10 s left turn at 40 deg/s (400 deg total)
backends:
  lingbot_world_cam:
    matches_canonical: false
    as_run: >-
      161 camera poses at 16 fps (10 s). First person: one counter-clockwise
      turn in place (360 deg). Third person: two counter-clockwise look-at
      orbits around the character (720 deg).
    source: tools/generation/prepare_prompt_case_inputs.py (byte-identical to the rollout inputs)
  matrix_game_3:
    matches_canonical: false
    as_run: >-
      177-frame key schedule for the deterministic adapter: `j` (turn left,
      upstream CAM_VALUE 0.1) every frame; third person adds `d` (strafe right)
      so the camera orbits the character (no native orbit control).
    source: tools/generation/prepare_prompt_case_inputs.py
  waypoint15:
    matches_canonical: false
    as_run: >-
      actions.txt ArrowLeft/ArrowRight mapped to a constant mouse yaw of 0.15
      per 66.7 ms step (the paper's Waypoint "turn left" value); no text channel,
      so the prompt is unused.
    source: tools/generation/generate_waypoint15_candidates_modal.py
  project_genie:
    matches_canonical: unknown
    as_run: Hosted browser session; key timing and turn rate of the paper rollouts are not recorded in this repository.
  hy_worldplay:
    matches_canonical: unknown
    as_run: Scored from the existing rollouts; their camera inputs are not recorded in this repository.
