schema_version: 1
description: >-
  Single source for how each backend receives the canonical Table 4/7 semantic
  trajectories (experiments/tables_4_7/trajectories/*.yaml). The trajectory
  YAMLs stay authoritative and hash-locked; this file adds what they cannot
  express without changing their hashes: the entity each trajectory controls,
  each backend's native timeline, which action targets it can express, and the
  frozen response-side calibration used to compile camera motion.

# What each semantic trajectory actuates. A backend may only receive a
# trajectory whose target it declares under `supports`; anything else is
# reported as unsupported, never silently substituted (e.g. moving the camera
# instead of the car).
action_targets:
  table4.racing_car.drive_v1: {target: ego_vehicle, frame: vehicle_body}
  table4.billiard_game.first_person_ball_wasd_v1: {target: cue_ball, frame: table_plane}
  table4.billiard_game.center_ball_shot_v1: {target: table_objects, frame: table_plane}
  controllability.ball_roller.collision_path_v1: {target: ball, frame: ground_plane}
  controllability.mirror_rolling_ball.axis_cycle_v1: {target: ball, frame: ground_plane}
  controllability.beam_domino.clean_strike_v1: {target: ball, frame: ground_plane}
  table7.camera.perturb_in_v1: {target: camera, frame: camera_yaw}
  table7.camera.perturb_out_v1: {target: camera, frame: camera_yaw}
  table7.camera.360_in_v1: {target: camera, frame: camera_yaw}
  table7.camera.360_out_v1: {target: camera, frame: camera_yaw}

backends:
  unity:
    interface: unity_runtime_args
    supports:
      camera: reference
      ego_vehicle: reference
      cue_ball: reference
      ball: reference
      table_objects: reference

  project_genie:
    interface: browser_keyboard
    note: Key rules live in each trajectory's `adapters.project_genie` block.
    supports:
      camera: nominal_left_turn_calibrated
      ego_vehicle: nominal
      cue_ball: nominal
      ball: nominal
    unsupported:
      table_objects: The hosted web interface has no placement, cue-angle, strength, spin, or execute controls.
    calibration:
      left_turn_deg_per_s: 51.4735
      right_turn: no reliable full-yaw correlation peak; not frozen

  matrix_game_2:
    interface: keyboard_mouse
    frames: 129
    fps: 12.0
    latent_frames: 33
    keyboard_width: 4
    supports:
      camera: response_calibrated_repeat_validated
      ego_vehicle: target_entity_validation_required
      cue_ball: target_entity_validation_required
      ball: target_entity_validation_required
    unsupported:
      table_objects: No object-placement or cue-shot controls.
    # Visual degrees per mouse unit per frame. Two independent short-probe
    # seeds at +/-0.3 mouse units gave gains near 10.1. Production-shaped
    # Garden validation reached -332.715 / +353.859 degrees from nominal
    # +/-360-degree schedules; a direction-specific one-step correction made
    # the negative response worse (-309.723), i.e. saturation, so the pooled
    # gain is frozen for every regime and residual error is model behaviour.
    camera_gain_deg_per_mouse_unit:
      pooled_bidirectional: 10.1

  matrix_game_3:
    interface: keyboard_mouse
    frames: 177
    fps: 17.0
    iterations: 4
    keyboard_width: 6
    upstream_geometric_deg_per_mouse_unit: 15.0
    supports:
      camera: response_calibrated_repeat_validated
    unsupported:
      ego_vehicle: Not part of the requested Matrix-Game 3.0 scope (Table 7 only).
      cue_ball: Not part of the requested Matrix-Game 3.0 scope (Table 7 only).
      ball: Not part of the requested Matrix-Game 3.0 scope (Table 7 only).
      table_objects: No object-placement or cue-shot controls.
    # Response-side gains from clean Garden validation videos. Short
    # perturbations are linear; full turns accumulate a small direction-
    # dependent bias and use their own measured gains.
    camera_gain_deg_per_mouse_unit:
      perturb_negative: 11.175
      perturb_positive: 11.234
      full_turn_negative: 10.511
      full_turn_positive: 11.434

  lingbot_world_cam:
    interface: camera_pose
    frames: 161
    fps: 16.0
    supports:
      camera: nominal_pose_no_response_correction
    unsupported:
      ego_vehicle: Base Cam consumes camera extrinsics/intrinsics only; it cannot steer the car.
      cue_ball: Base Cam consumes camera extrinsics/intrinsics only; it cannot move the ball.
      ball: Base Cam consumes camera extrinsics/intrinsics only; it cannot move the ball.
      table_objects: Base Cam consumes camera extrinsics/intrinsics only.
    # Response is nonlinear and horizon-sensitive, so nominal Unity pose paths
    # are frozen without correction. Exact-horizon Garden run0 responses were
    # -17.72 / +41.37 degrees (perturbations) and +54.91 / +277.88 degrees
    # (signed full turns); report realized yaw alongside consistency metrics.

  # Action-conditioned LingBot-World. One frame per 100 ms action tick, so the
  # real frame rate is 10 fps even though the mp4 container is tagged 16 fps
  # (see candidate_fps_override). Evaluated on object-control scenes only; the
  # camera cases use lingbot_world_cam.
  lingbot_world_act:
    interface: action_conditioned
    action_tick_ms: 100
    real_fps: 10.0
    container_fps: 16.0
    supports:
      ball: nominal
    unsupported:
      camera: The Act variant is evaluated on object-control scenes; camera cases use lingbot_world_cam.
      ego_vehicle: No Act adapter for vehicle control.
      cue_ball: No Act adapter for cue-ball control.
      table_objects: No object-placement or cue-shot controls.

  # Waypoint-1.5 is a first-person keys + mouse model: W/A/S/D translate and the
  # mouse rotates the ego camera. It has no channel for an object, so asking it
  # to steer one would silently move the camera instead -- recorded as
  # unsupported rather than scored.
  waypoint15:
    interface: keyboard_mouse
    fps: 60.0
    frames_per_control_step: 4
    supports:
      camera: nominal
    unsupported:
      ego_vehicle: Keys and mouse drive the first-person ego camera; there is no vehicle channel.
      cue_ball: Keys and mouse drive the first-person ego camera; there is no object channel.
      ball: Keys and mouse drive the first-person ego camera; there is no object channel.
      table_objects: Keys and mouse drive the first-person ego camera; there is no object channel.
