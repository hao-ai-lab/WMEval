# HISTORICAL (2026-10-11 .. 2026-10-20): per-backend capability review of the strict
# 2 m / 10 s / 12 fps look-at-orbit protocol of the retired case
# SunRisesAndSets/lighting_orbit_v2 (see README.md here). It was the trajectory_support
# block of experiments/tables_4_7/action_backends.yaml; the live lighting case
# (SunRisesAndSets/lighting, the paper-native protocol) is not gated by it.
# Kept verbatim except for evidence paths, which now point into this directory.
schema_version: 1
# Full translation plus look-at is reviewed independently from Table 7 yaw.
# Pending means incomplete work, never N/A or a model-quality rejection.
trajectory_support:
  lighting.camera.look_at_orbit_v2:
    target: camera
    backends:
      unity:
        status: supported
        reason: Deterministic 121-frame capture verifies the complete orbit, fixed sun and static objects against analytic
          C2W; endpoint and pixel closure evidence are in the case bundle.
        source_revision: 84a06a422ae0a0d04153596e881c85be8d4ff3f1
        evidence: experiments/lighting_orbit/calibration_assets/geometry_qa.json
      lingbot_world_cam:
        status: supported
        reason: Pinned Cam source accepts per-frame C2W and intrinsics; all five formal seeds accepted the 161-pose complete
          orbit and completed Lite scoring. Generation distortion remains measured model behavior.
        source_revision: a43bec7f8091c83e9b30b16b912f6fc906236fa6
        evidence: experiments/lighting_orbit/results/run_summary.json
      matrix_game_2:
        status: unsupported
        reason: Pinned native API accepts keyboard/mouse tokens, with no camera-pose/target channel or documented key-to-metre
          conversion. Independent probes did not establish a verified conversion for the complete metric path. This strict
          trajectory is N/A for the audited release interface; free navigation and generated-video quality are separate.
        evidence: experiments/lighting_orbit/results/capability_audit.json
      matrix_game_3:
        status: supported
        reason: The pinned native pose path receives the full analytic C2W orbit with a fixed basis and intrinsics conversion;
