        source_revision: 756776d516233027631008761d4d40ddaea3e23a
        evidence: experiments/lighting_orbit/results/run_summary.json
      waypoint:
        status: unsupported
        reason: Pinned native API accepts keyboard/mouse tokens, with no camera-pose/target channel or documented key-to-metre
          conversion. Independent probes did not establish a verified conversion for the complete metric path. This strict
          trajectory is N/A for the audited release interface; free navigation and generated-video quality are separate.
        source_revision: b3f1e725b222679a517632918cc78bba0c9fa433
        evidence: experiments/lighting_orbit/results/capability_audit.json
      hy_worldplay:
        status: supported
        reason: Pinned native pose_to_input consumed 64 analytic C2W poses and K for 253 frames at 24 fps; all five formal
          seeds and Lite scoring completed. Full action state loaded strictly, native four-step AR/torch_causal attention
          and BF16 retained, endpoint held after 10 seconds.
        source_revision: 1588e1336e842b03b0a7860c654ebd7c46bb065e
        evidence: experiments/lighting_orbit/results/run_summary.json
      project_genie:
        status: unsupported
