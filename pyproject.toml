[project]
name = "wmeval-controllability"
version = "0.1.0"
description = "World-model controllability metrics (RAFT + optional synthetic flow)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
depth = ["transformers>=4.40", "pillow"]
